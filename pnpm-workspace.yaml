packages:
  - "apps/*"
  - "packages/*"
allowBuilds:
  esbuild: true
overrides:
  # GHSA-g7r4-m6w7-qqqr: esbuild dev-server arbitrary file read on Windows,
  # patched in 0.28.1. Pulled in transitively via Storybook/Vite/tsup (dev-only,
  # never shipped in published packages) — pinned here since upstream hasn't
  # bumped it yet. Flagged by GitHub Dependabot 2026-07-18.
  esbuild: ">=0.28.1"
  # CVE-2026-14257 / GHSA-mh99-v99m-4gvg: brace-expansion DoS via unbounded
  # expansion length, patched in 5.0.8. Two copies existed: one reached via
  # ESLint core + Storybook's docgen-typescript plugin (minimatch@10.2.5, a
  # plain patch-version bump, no risk); one reached via
  # eslint-plugin-jsx-a11y/eslint-plugin-react (minimatch@3.1.5 — the last-
  # ever 3.x release, requesting brace-expansion@^1.1.7 with no patched 1.x
  # release available upstream). Forcing this override for the second path
  # only works because of the minimatch@3.1.5 patch below — brace-expansion
  # >=2 exports `{ expand }` instead of a callable default, which would
  # otherwise crash minimatch@3.1.5's own `require('brace-expansion')` call
  # site (confirmed empirically, not just from reading the source — a plain
  # override without the patch throws "expand is not a function" on every
  # lint run). Dev-only in both paths, never shipped in published packages.
  # Flagged by GitHub Dependabot 2026-07-26. Bumped to >=5.0.9 on 2026-08-08
  # (CVE-2026-69152 / GHSA-rgw5-rvv9-x895): a second DoS via unbounded
  # intermediate arrays that bypasses the CVE-2026-14257 mitigation above —
  # >=5.0.8 was no longer sufficient on its own. Same dev-only paths, same
  # minimatch@3.1.5 patch below still required (still >=2's export shape).
  brace-expansion: ">=5.0.9"
  # GHSA-4cwx-7wf7-3272 (+4 related moderate advisories, same patched
  # version): undici vulnerable to cross-user info disclosure, parse-time
  # crashes, CRLF injection, and response desync, all patched in 7.29.0.
  # Reached only via jsdom (itself only via vitest) — dev/test-only, never
  # shipped. Flagged by GitHub Dependabot 2026-08-08.
  #
  # Range capped at `<8.0.0` deliberately, not left open-ended — a first
  # attempt at `>=7.29.0` let pnpm resolve to `undici@8.10.0` (the latest
  # version satisfying that constraint), which broke every test run
  # (`Cannot find module 'undici/lib/handler/wrap-handler.js'`): jsdom@29.1.1
  # does an internal deep `require()` into undici's own file layout (not its
  # public API) at a path that only exists in the 7.x line it actually
  # declares support for (`^7.25.0`) — confirmed by checking jsdom's own
  # declared undici range and reproducing the failure, not guessed.
  undici: ">=7.29.0 <8.0.0"
  # GHSA-5p4m-2wfm-xmqj: js-yaml quadratic CPU consumption (CVE-2026-59870,
  # ReDoS-style) in !!omap resolution. Two coexisting majors, both reached
  # only through @changesets/cli (dev-only release tooling, never shipped):
  # js-yaml@3.x via read-yaml-file, js-yaml@4.x via @changesets/parse —
  # scoped per-parent so each keeps its own major rather than one blanket
  # range colliding across both. Found via `pnpm audit`, 2026-08-08 (ahead
  # of a GitHub Dependabot alert for this one at the time of fixing).
  # Bumped 3.x's own floor to >=3.15.2 on 2026-09-09 (GHSA-2883-xcg3-v3hh:
  # maxTotalMergeKeys doesn't limit CPU use for empty merge sources, a
  # separate advisory from the one above) — the prior >=3.15.1 floor was
  # exactly what pnpm had resolved to, and 3.15.1 itself is vulnerable to
  # this newer advisory; 3.15.2 is the next (and latest) 3.x release,
  # confirmed to exist on the registry before pinning to it.
  read-yaml-file>js-yaml: ">=3.15.2 <4.0.0"
  "@changesets/parse>js-yaml": ">=4.3.1"
  # GHSA-...-nanoid-zero-size (nanoid): custom generators can loop
  # indefinitely when size is 0, patched in 3.3.17. Dev-only, pulled in
  # transitively by the Vite/Storybook toolchain. Found via `pnpm audit`,
  # 2026-08-08.
  nanoid: ">=3.3.17"
  # GHSA-fxqj-rqcc-2cmp: PostCSS — incomplete fix of an earlier advisory,
  # still reads an attacker-controlled sourceMappingURL's arbitrary .map
  # file when `from` is unset, patched in 8.5.23. Dev-only, pulled in via
  # Vite (Storybook's bundler). Found via `pnpm audit`, 2026-08-08.
  postcss: ">=8.5.23"
  # GHSA-c83g-rgw3-j3cx (unbounded memory growth / cache never evicted) and
  # GHSA-73wf-gq98-2v4g (crash / prototype write via untrusted
  # browserslist-stats.json), both patched in 4.28.7. Reached only via
  # @babel/core's own @babel/helper-compilation-targets — through
  # @storybook/react-vite>@storybook/react>react-docgen, and separately
  # through eslint-plugin-react-hooks — dev-only, never shipped in published
  # packages. @babel/helper-compilation-targets@7.29.7 declares an
  # open-ended `^4.24.0` browserslist range, so this floor stays within its
  # own compatible major — no adjacent-major risk like the undici case
  # above. Flagged by GitHub Dependabot 2026-09-03.
  browserslist: ">=4.28.7"
  # GHSA-82fw-gwwq-j3cx: Vitest path traversal / arbitrary file read via
  # @vitest/mocker's redirect-mock handling, patched in 4.1.11. Both
  # `vitest` and `@vitest/mocker` were resolved at exactly 4.1.10 — a
  # single patch release behind — reached only via
  # @storybook/addon-vitest's own @vitest/browser/@vitest/browser-
  # playwright dependencies (dev-only Storybook test tooling, never
  # shipped in published packages). Range capped at the current major
  # (`<5.0.0`), not left open-ended, matching the project's own established
  # pattern above — both packages already sit deep in the 4.1.x line with
  # no adjacent-major consumer to worry about here. Flagged by GitHub
  # Dependabot 2026-09-09.
  vitest: ">=4.1.11 <5.0.0"
  "@vitest/mocker": ">=4.1.11 <5.0.0"
  # Kept version-locked with the vitest/@vitest/mocker bump above — without
  # these, pnpm left @vitest/browser and @vitest/browser-playwright one
  # patch behind at 4.1.10, producing a real (self-caused) `pnpm peers
  # check` mismatch (`unmet peer @vitest/browser-playwright: wanted
  # 4.1.11`). Not a separate advisory of their own, just keeping the whole
  # vitest family in sync at the same patch release.
  "@vitest/browser": ">=4.1.11 <5.0.0"
  "@vitest/browser-playwright": ">=4.1.11 <5.0.0"
patchedDependencies:
  # Bridges brace-expansion's >=2 export shape (see the brace-expansion
  # override above) so the >=5.0.8 override doesn't crash this package's
  # own `require('brace-expansion')` call site. Purely a compatibility
  # shim — doesn't change minimatch@3.1.5's own behavior when
  # brace-expansion happens to resolve to a 1.x-shaped export either.
  minimatch@3.1.5: patches/minimatch@3.1.5.patch
