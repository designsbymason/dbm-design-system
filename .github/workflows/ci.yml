name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: ".nvmrc"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Audit dependencies
        run: pnpm audit

      - name: Lint
        run: pnpm lint

      - name: Build
        run: pnpm build

      - name: Check per-component bundle size
        run: pnpm --filter @dbm-design-system/components check-component-bundle-size

      - name: Check Foundations token coverage
        run: pnpm --filter @dbm-design-system/components check-foundations-token-coverage

      - name: Build Storybook
        run: pnpm --filter @dbm-design-system/components build-storybook

      - name: Check Storybook bundle size
        run: pnpm --filter @dbm-design-system/components check-storybook-bundle-size

      - name: Test
        run: pnpm test

  # Named for both jobs it runs, not just the original visual-regression one
  # — @storybook/addon-vitest's "storybook" test project (added 2026-08-16)
  # joined this job rather than getting its own, since it needs the exact
  # same setup (workspace build + a real Chromium via Playwright) and a
  # second full checkout/install/build cycle would just duplicate that cost.
  browser-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: ".nvmrc"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build workspace packages
        run: pnpm build

      - name: Install Playwright browser
        working-directory: packages/components
        run: pnpm exec playwright install --with-deps chromium

      - name: Run visual regression tests
        working-directory: packages/components
        run: pnpm test:visual

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: packages/components/playwright-report/
          retention-days: 14

      # Runs every story — and every story's play function — as a real
      # Vitest test in that same Chromium instance. Known, already-triaged
      # findings are marked `parameters.a11y.test: "todo"` at the story
      # level (see guidelines/01-vision-and-goals.md §12); everything else
      # stays at the global `error` default, so a real new regression here
      # fails the build the same way a broken unit test already does.
      - name: Run Storybook component/interaction/a11y tests
        working-directory: packages/components
        run: pnpm test:storybook
